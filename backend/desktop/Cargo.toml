[package]
name = "Boost"
version = "0.5.0"
description = "Boost desktop shell, native commands and service lifecycle"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[features]
portable-runtime = ["tauri/custom-protocol"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
zstd = "0.13"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "6"
tauri = { version = "2.10.3", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.4.0"
boost-core = { path = "../core" }
boost-service = { path = "../service" }
webbrowser = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rfd = "0.15"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
