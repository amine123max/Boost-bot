name: Release Boost

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.5.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    env:
      BOOST_UPDATE_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TEMP: ${{ github.workspace }}/tmp/boost-release
      TMP: ${{ github.workspace }}/tmp/boost-release
      TMPDIR: ${{ github.workspace }}/tmp/boost-release
      npm_config_cache: ${{ github.workspace }}/tmp/boost-release/npm-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Verify release version
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Build and verify frontend
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend run test:runtime
          pnpm -C frontend run build:desktop
      - name: Prepare embedded Bot runtime
        run: node scripts/prepare-boost-bot.mjs
      - name: Verify updater regressions
        run: cargo test --manifest-path backend/desktop/Cargo.toml --lib commands::updater
      - name: Prepare packaging config
        run: node -e "require('fs').writeFileSync(process.env.TMPDIR + '/tauri-release.json', JSON.stringify({build:{beforeBuildCommand:''}}))"
      - name: Package desktop
        working-directory: backend/desktop
        env:
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx --yes --package @tauri-apps/cli@2.11.3 tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config "$TMPDIR/tauri-release.json"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            backend/desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            backend/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            backend/desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb
            backend/desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: tmp/boost-release/artifacts
          merge-multiple: true
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          export TEMP="$GITHUB_WORKSPACE/tmp/boost-release"
          export TMP="$TEMP" TMPDIR="$TEMP"
          mapfile -d '' assets < <(find tmp/boost-release/artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print0)
          test "${#assets[@]}" -ge 5
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Boost $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
