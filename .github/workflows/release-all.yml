name: Release Boost

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.5.0'
        required: true
        type: string
      reuse_run_id:
        description: 'Reuse desktop artifacts from this run instead of rebuilding (same tag commit required)'
        required: false
        type: string
        default: ''
      portable_only:
        description: 'Rebuild only the Windows portable EXE for an existing release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.reuse_run_id }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.portable_only && '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]' || '[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"},{"os":"macos-15","target":"aarch64-apple-darwin","bundles":"dmg"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      BOOST_UPDATE_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      TEMP: ${{ github.workspace }}/tmp/boost-release
      TMP: ${{ github.workspace }}/tmp/boost-release
      TMPDIR: ${{ github.workspace }}/tmp/boost-release
      npm_config_cache: ${{ github.workspace }}/tmp/boost-release/npm-cache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Prepare Windows temporary directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Path $env:TMPDIR -Force | Out-Null
      - name: Prepare Unix temporary directory
        if: runner.os != 'Windows'
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify release version
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Build and verify frontend
        run: |
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend run test:runtime
          pnpm -C frontend run build:desktop
      - name: Prepare embedded Bot runtime
        run: node scripts/prepare-boost-bot.mjs
      - name: Verify updater regressions
        if: ${{ !inputs.portable_only }}
        run: cargo test --manifest-path backend/desktop/Cargo.toml --lib commands::updater
      - name: Prepare packaging config
        run: node -e "require('fs').writeFileSync(process.env.TMPDIR + '/tauri-release.json', JSON.stringify({build:{beforeBuildCommand:''}}))"
      - name: Package desktop
        if: ${{ !inputs.portable_only }}
        working-directory: backend/desktop
        env:
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx --yes --package @tauri-apps/cli@2.11.3 tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config "$TMPDIR/tauri-release.json"
      - name: Package portable desktop
        if: runner.os == 'Windows'
        run: python scripts/package-portable.py --target "${{ matrix.target }}" --output "$TMPDIR/portable"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            backend/desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            backend/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            tmp/boost-release/portable/*.exe

  publish:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.reuse_run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PORTABLE_ONLY: ${{ inputs.portable_only || false }}
      ARTIFACT_RUN_ID: ${{ inputs.reuse_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Verify artifact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/$ARTIFACT_RUN_ID" --jq '.head_sha')" = "$(git rev-parse HEAD)"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          pattern: desktop-*
          path: tmp/boost-release/artifacts
          merge-multiple: true
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          export TEMP="$GITHUB_WORKSPACE/tmp/boost-release"
          export TMP="$TEMP" TMPDIR="$TEMP"
          mapfile -d '' assets < <(find tmp/boost-release/artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -print0)
          if [[ "$PORTABLE_ONLY" == "true" ]]; then
            test "${#assets[@]}" -eq 1
            gh release view "$RELEASE_TAG" >/dev/null
          else
            test "${#assets[@]}" -eq 3
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Boost $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          test "$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | map(select(.name | endswith(".exe") or endswith(".dmg"))) | length')" -eq 3
          release_api=$(gh release view "$RELEASE_TAG" --json apiUrl --jq '.apiUrl')
          gh api "$release_api" > "$TEMP/release-assets.json"
          python - <<'PY_CHECKSUM'
          import json, os, pathlib, re
          directory = pathlib.Path(os.environ["TEMP"])
          release = json.loads((directory / "release-assets.json").read_text())
          assets = sorted((asset for asset in release["assets"] if asset["name"].endswith((".exe", ".dmg"))), key=lambda asset: asset["name"])
          if len(assets) != 3:
              raise SystemExit("Expected three desktop release assets")
          lines = []
          for asset in assets:
              digest = asset.get("digest", "")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"Missing SHA-256 for {asset['name']}")
              lines.append(f"{digest.removeprefix('sha256:')}  {asset['name']}\n")
          (directory / "SHA256SUMS.txt").write_text("".join(lines), encoding="utf-8")
          PY_CHECKSUM
          gh release upload "$RELEASE_TAG" "$TEMP/SHA256SUMS.txt" --clobber
          if [[ -f "docs/releases/$RELEASE_TAG.md" ]]; then
            gh release edit "$RELEASE_TAG" --title "Boost ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
