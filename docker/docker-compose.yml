services:
  boost-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.service
    restart: unless-stopped
    environment:
      BOOST_SERVICE_ADDR: 0.0.0.0:12580
      BOOST_DB_PATH: /data/boost.db
      BOOST_RPC_TOKEN_FILE: /data/boost.rpc-token
      BOOST_GATEWAY_TRACE_STDOUT: "1"
      BOOST_GATEWAY_ERROR_STDOUT: "1"
      # Optional mitigation for same key/path/model head-of-line gate waits:
      # BOOST_REQUEST_GATE_WAIT_TIMEOUT_MS: "5000"
    volumes:
      - boost-data:/data
    ports:
      - "12580:12580"

  boost-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      boost-service:
        condition: service_healthy
    environment:
      BOOST_WEB_ADDR: 0.0.0.0:12000
      BOOST_WEB_NO_SPAWN_SERVICE: "1"
      BOOST_SERVICE_ADDR: boost-service:12580
      BOOST_DB_PATH: /data/boost.db
      BOOST_RPC_TOKEN_FILE: /data/boost.rpc-token
      BOOST_WEB_NO_OPEN: "1"
      BOOST_GATEWAY_TRACE_STDOUT: "1"
      BOOST_GATEWAY_ERROR_STDOUT: "1"
      # Optional mitigation for same key/path/model head-of-line gate waits:
      # BOOST_REQUEST_GATE_WAIT_TIMEOUT_MS: "5000"
    volumes:
      - boost-data:/data
    ports:
      - "12000:12000"

volumes:
  boost-data:
