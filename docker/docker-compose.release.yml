services:
  boost-service:
    image: ghcr.io/qxcnm/boost-service:${BOOST_RELEASE_TAG:?set BOOST_RELEASE_TAG}
    restart: unless-stopped
    environment:
      BOOST_SERVICE_ADDR: 0.0.0.0:12580
      BOOST_DB_PATH: /data/boost.db
      BOOST_RPC_TOKEN_FILE: /data/boost.rpc-token
    volumes:
      - boost-data:/data
    ports:
      - "12580:12580"

  boost-web:
    image: ghcr.io/qxcnm/boost-web:${BOOST_RELEASE_TAG:?set BOOST_RELEASE_TAG}
    restart: unless-stopped
    depends_on:
      boost-service:
        condition: service_healthy
    environment:
      BOOST_WEB_ADDR: 0.0.0.0:12000
      BOOST_WEB_NO_SPAWN_SERVICE: "1"
      BOOST_SERVICE_ADDR: boost-service:12580
      BOOST_DB_PATH: /data/boost.db
      BOOST_RPC_TOKEN_FILE: /data/boost.rpc-token
      BOOST_WEB_NO_OPEN: "1"
    volumes:
      - boost-data:/data
    ports:
      - "12000:12000"

volumes:
  boost-data:
