<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif"><rect width="1280" height="720" fill="#FFFFFF"/><text x="80" y="104" font-size="44" font-weight="700" fill="#1B2430" text-anchor="start">好的投影，总是不够方便</text><rect x="80" y="128" width="72" height="6" rx="3" fill="#D9601A"/><text x="1200" y="672" font-size="20" font-weight="400" fill="#5F6B7A" text-anchor="end">3</text><rect x="80" y="200" width="352" height="340" rx="14" fill="#F2F4F7"/><text x="112" y="310" font-size="76" font-weight="700" fill="#D9601A" text-anchor="start">78%</text><text x="112" y="390" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">的用户觉得</text><text x="112" y="430" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">设备太重、不想带</text><rect x="464" y="200" width="352" height="340" rx="14" fill="#F2F4F7"/><text x="496" y="310" font-size="76" font-weight="700" fill="#D9601A" text-anchor="start">6 分钟</text><text x="496" y="390" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">平均开机到</text><text x="496" y="430" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">对焦完成的时间</text><rect x="848" y="200" width="352" height="340" rx="14" fill="#F2F4F7"/><text x="880" y="310" font-size="76" font-weight="700" fill="#D9601A" text-anchor="start">41%</text><text x="880" y="390" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">的家用投影</text><text x="880" y="430" font-size="26" font-weight="400" fill="#1B2430" text-anchor="start">一年用不到十次</text><text x="80" y="610" font-size="24" font-weight="400" fill="#5F6B7A" text-anchor="start">来源：2026 年 6 月用户调研，样本 1,200 人</text></svg>
